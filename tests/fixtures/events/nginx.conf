worker_processes 2;
master_process on;
daemon off;
pid /tmp/openresty-events-contract.pid;
error_log stderr info;

events {
    worker_connections 256;
}

http {
    access_log off;
    lua_package_path "/opt/openresty/lualib/?.lua;/opt/openresty/lualib/?/init.lua;;";

    init_by_lua_block {
        local process = require("ngx.process")
        local ok, err = process.enable_privileged_agent(100)
        assert(ok, "events-contract privileged-agent init failed: " .. tostring(err))

        _G.events_contract = require("resty.events").new({
            broker_id = 0,
            listening = "unix:/tmp/openresty-events-contract.sock",
            enable_privileged_agent = true,
        })
    }

    init_worker_by_lua_block {
        local process = require("ngx.process")
        local process_type = process.type()
        local worker_id = ngx.worker.id()
        local pid = ngx.worker.pid()
        local receiver = process_type == "privileged agent"
            and "privileged"
            or "worker-" .. tostring(worker_id)
        local events = _G.events_contract

        events:subscribe("contract", "*", function(data, event)
            ngx.log(ngx.WARN, "events-contract event=", event,
                " receiver=", receiver, " pid=", pid, " data=", data)
        end)

        local ok, err = events:init_worker()
        assert(ok, "events-contract init failed receiver=" .. receiver .. ": " .. tostring(err))
        ngx.log(ngx.WARN, "events-contract initialized receiver=", receiver, " pid=", pid)
    }

    server {
        listen unix:/tmp/openresty-events-contract.sock;

        location / {
            content_by_lua_block {
                _G.events_contract:run()
            }
        }
    }

    server {
        listen 8080;

        location = /ready {
            return 200 "ready\n";
        }

        location = /broker-ready {
            content_by_lua_block {
                if ngx.worker.id() == 0 and _G.events_contract:is_ready() then
                    ngx.say("broker-ready pid=" .. tostring(ngx.worker.pid()))
                    return
                end
                ngx.status = ngx.HTTP_SERVICE_UNAVAILABLE
                ngx.say("broker-not-ready")
            }
        }

        location = /modules {
            content_by_lua_block {
                local events = require("resty.events")
                assert(events._VERSION == "0.3.1")
                assert(require("resty.events.protocol"))
                assert(require("resty.events.queue"))
                assert(require("resty.expr.v1"))
                assert(require("resty.ipmatcher"))
                assert(require("resty.radixtree"))
                assert(require("cjson")._VERSION == "2.1.0.11")

                local resty_http_loadable = pcall(require, "resty.http")
                assert(not resty_http_loadable, "resty.http must remain unavailable on LUA_PATH")

                local resty_http = io.open("/opt/openresty/lualib/resty/http.lua", "r")
                if resty_http then
                    resty_http:close()
                    error("resty.http must remain absent from /opt/openresty/lualib")
                end

                ngx.say("modules-ok")
            }
        }

        location = /publish {
            content_by_lua_block {
                local id = ngx.var.arg_id
                if not id or not id:match("^[%w%-]+$") then
                    ngx.status = ngx.HTTP_BAD_REQUEST
                    ngx.say("invalid id")
                    return
                end

                local ok, err = _G.events_contract:publish("all", "contract", id, id)
                if not ok then
                    ngx.log(ngx.ERR, "events-contract publish failed: ", err)
                    ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                    ngx.say("publish failed")
                    return
                end
                ngx.say("published-" .. id)
            }
        }
    }
}
