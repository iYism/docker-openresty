name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Dockerfile"

jobs:

  build:
    environment: "build-image"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
    
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve OpenResty image version
        id: openresty-version
        env:
          OPENRESTY_VERSION: ${{ vars.OPENRESTY_VERSION }}
        run: |
          dockerfile_version="$(awk -F= '/^ARG OPENRESTY_VER=/{print $2; exit}' Dockerfile)"
          configured_version="${OPENRESTY_VERSION}"

          if [ -z "${dockerfile_version}" ]; then
            echo "OPENRESTY_VER is not defined in Dockerfile" >&2
            exit 1
          fi

          if [ -z "${configured_version}" ]; then
            image_version="${dockerfile_version}"
          else
            image_version="$(printf '%s\n%s\n' "${configured_version}" "${dockerfile_version}" | sort -V | tail -n 1)"
          fi

          echo "Dockerfile OpenResty version: ${dockerfile_version}"
          echo "Configured OpenResty version: ${configured_version:-<empty>}"
          echo "Resolved image version: ${image_version}"
          echo "version=${image_version}" >> "${GITHUB_OUTPUT}"
         
      - name: Build and push multi-platform Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t sungyism/openresty:latest \
            -t sungyism/openresty:${{ steps.openresty-version.outputs.version }} \
            .
